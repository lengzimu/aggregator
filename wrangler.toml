# Cloudflare Pages 本地开发配置（可选）
# 仅在使用 `wrangler pages dev` 本地调试 Function 时需要。
# 生产部署通过 Cloudflare 控制台 → Pages → 项目 → Settings → Functions → KV 绑定 完成，
# git push 后自动生效，无需本文件。

name = "content-aggregator"
pages_build_output_dir = "dist"

# KV 频率限制命名空间绑定（生产请在 Cloudflare 控制台绑定 RATE_LIMIT_KV）
# 1) 创建命名空间： npx wrangler kv namespace create RATE_LIMIT_KV
# 2) 把返回的 id 填入下方 id 字段，并取消注释本段
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = "your-kv-namespace-id"

# ── 短视频封面存储（Cloudflare R2）──────────────────────────────
# 生产绑定请在 Cloudflare 控制台完成（git push 自动生效）：
#   1) R2 桶绑定： Pages → 项目 → Settings → Bindings → 添加 R2 桶，
#      变量名填 COVER，绑定到封面桶（供 functions/api/cover.ts 直传）
#   2) 环境变量： Pages → Settings → Environment variables 添加
#      R2_PUBLIC_URL = https://<bucket>.r2.dev  （或自定义域，供函数返回公开 URL）
#      COVER_UPLOAD_TOKEN = <长随机串>          （functions/api/cover.ts 上传口令）
# 本地脚本 / CI（store-cover.mjs、import.mjs 的 STORE_COVERS=1）用 S3 API，
# 需要 R2 凭据（非绑定）：R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY
# CI 请在仓库 Secrets 配置上述四项 + R2_PUBLIC_URL。

# ── KV 频率限制（DMCA 端点 /api/dmca 单 IP 限流）────────────────
# namespace 在仪表板创建（dmca-rate-limit），绑定经本文件声明（wrangler.toml 托管模式）
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "05b0de1c7a8247598cd326c9ecc792aa"

# ── Cloudflare Pages 构建时环境变量 ──────────────────────────────
# 普通文本变量只能在这里管理（wrangler.toml 托管模式，仪表板仅可配机密）；
# 机密（GITHUB_TOKEN、TURNSTILE_SECRET_KEY）在仪表板「变量和密钥」用「密钥」类型配置。
[vars]
PUBLIC_SITE_URL = "https://aggregator-9w7.pages.dev"
GITHUB_REPO = "lengzimu/aggregator"
# 每窗口单 IP 最大 DMCA 提交数 / 窗口秒数（不配则默认 5 次 / 3600 秒）
# RATE_LIMIT_MAX = "5"
# RATE_LIMIT_WINDOW_SEC = "3600"
